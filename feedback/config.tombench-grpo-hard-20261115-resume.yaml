# ToMBench hard-question synthesis for checkpoint-124.
# API credentials are resolved from the existing local api_config.toml profiles.
stage: synth
max_bad_cases: 0

api_config: D:/workspace/pre/rsi/ToMEval-main/api_config.toml
api_profile: synthesis

synthesis_model:
  model_name: gemini-4-hydrogen
  temperature: 0.6
  max_tokens: 32768
  max_workers: 12
  enable_thinking: false

roles:
  diagnosis:
    api_profile: sombench.judge1
    model_name: gpt-6-astra
    max_workers: 12
    max_tokens: 32768
    temperature: 0.6
    enable_thinking: false
  synthesis:
    api_profile: synthesis
    model_name: gemini-4-hydrogen
    max_workers: 8
    max_tokens: 32768
    temperature: 0.6
    enable_thinking: false

output_path: D:/workspace/pre/rsi/output/tombench-grpo-hard-20261115
predictions_root: D:/workspace/pre/rsi/output/tomeval-sft-final-20261111-01/feedback_inputs/results

leakage_guard:
  test_root: D:/workspace/pre/rsi/ToMTestDatasets
  threshold: 0.6
  internal_threshold: 0.85
  num_perm: 128
  ngram: 4

synthesis:
  max_retries_per_diagnosis: 3
  bad_cases_per_report: 2
  diagnosis_batch_size: 12
  synthesis_batch_size: 20
  target_difficulty: hard_mix
  difficulty_weights:
    hard: 0.70
    medium: 0.25
    easy: 0.05

synthesis_datasets:
  - name: ToMBench
    target_samples: 2300
    samples_per_report: 8
    models:
      - name: qwen3.8-flash-next-sft-final
        exp: 20261111-01





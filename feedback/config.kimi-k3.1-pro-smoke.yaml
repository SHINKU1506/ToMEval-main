# 本机小规模端到端测试配置。评测/诊断角色使用 Astra，复核使用 Opus 5.5，合成角色使用 Gemini-4-Hydrogen。

stage: all
max_bad_cases: 20

api_config: ../api_config.toml
api_profile: synthesis

synthesis_model:
  model_name: gemini-4-hydrogen
  api_url: ""
  api_key: ""
  temperature: 0.6
  presence_penalty: 0
  max_tokens: 32768
  max_workers: 4
  enable_thinking: false
  system_prompt: ""
  request_interval_seconds: 1

roles:
  diagnosis:
    api_profile: sombench.judge1
    model_name: gpt-6-astra
    max_workers: 2
    max_tokens: 32768
    temperature: 0.6
    enable_thinking: false
  synthesis:
    api_profile: synthesis
    model_name: gemini-4-hydrogen
    max_workers: 4
    max_tokens: 32768
    temperature: 0.6
    enable_thinking: false
  repair:
    api_profile: synthesis
    model_name: gemini-4-hydrogen
    max_workers: 4
    max_tokens: 8192
    temperature: 0.3
    enable_thinking: false
  blind_answer:
    api_profile: sombench.judge1
    model_name: gpt-6-astra
    max_workers: 2
    max_tokens: 8192
    temperature: 0.2
    enable_thinking: false
  adjudication:
    api_profile: sombench.judge2
    model_name: claude-opus-5-5
    max_workers: 2
    max_tokens: 8192
    temperature: 0.2
    enable_thinking: false

output_path: ../output/tomeval-sft-final-20261111-01/feedback_smoke_gemini4
filter_input_root: ../filter_inputs/tomeval-sft-final-20261111-01-smoke-gemini4
predictions_root: ../output/tomeval-sft-final-20261111-01/feedback_inputs/results

leakage_guard:
  test_root: ../ToMTestDatasets
  threshold: 0.6
  internal_threshold: 0.85
  num_perm: 128
  ngram: 4

synthesis:
  max_retries_per_diagnosis: 2
  bad_cases_per_report: 3
  diagnosis_batch_size: 5
  synthesis_batch_size: 5

synthesis_datasets:
  - name: ToMBench
    target_samples: 5
    samples_per_report: 1
    models:
      - name: qwen3.8-flash-next-sft-final
        exp: 20261111-01
